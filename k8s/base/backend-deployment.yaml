apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-unit-backend
  labels:
    app.kubernetes.io/name: clinical-unit-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clinical-unit
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-unit-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-unit-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: clinical-unit
    spec:
      serviceAccountName: clinical-unit
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: clinical-unit-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clinical-unit-backend
            - secretRef:
                name: clinical-unit-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}